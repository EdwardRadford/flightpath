workflows:
  ios-testflight:
    name: FlightPath iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/ios/Pods
    integrations:
      app_store_connect: Flight Path Admin
    environment:
      groups:
        - flightpath_secrets
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        BUNDLE_IDENTIFIER: uk.co.flightpath.flightPath
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter packages get
        script: flutter packages pub get
      - name: Analyzer
        script: flutter analyze
      - name: Unit tests
        script: flutter test
      - name: Add PrivacyInfo to Xcode project
        script: |
          gem install xcodeproj
          ruby tool/add_privacy_manifest.rb
      - name: Set up code signing
        script: |
          set -e
          set -x
          keychain initialize

          echo "=== existing certs ==="
          app-store-connect certificates list --type IOS_DISTRIBUTION || true

          echo "=== existing bundle ids ==="
          app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_IDENTIFIER" || true

          echo "=== existing profiles ==="
          app-store-connect profiles list --bundle-id-identifier "$BUNDLE_IDENTIFIER" --type IOS_APP_STORE || true

          echo "=== creating dist cert if missing ==="
          if ! app-store-connect certificates list --type IOS_DISTRIBUTION 2>/dev/null | grep -q "id:"; then
            app-store-connect certificates create --type IOS_DISTRIBUTION --save
          else
            echo "Distribution cert already exists"
          fi

          echo "=== fetching signing files ==="
          app-store-connect fetch-signing-files "$BUNDLE_IDENTIFIER" \
            --type IOS_APP_STORE \
            --create

          keychain add-certificates
          xcode-project use-profiles
      - name: Pod install
        script: |
          cd ios
          pod install
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1) \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_IDENTIFIER") + 1)) \
            --dart-define=REVENUECAT_IOS_KEY=$REVENUECAT_IOS_KEY \
            --dart-define=REVENUECAT_ANDROID_KEY=$REVENUECAT_ANDROID_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"
