workflows:
  ios-testflight:
    name: FlightPath iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/ios/Pods
    integrations:
      app_store_connect: Flight Path Admin
    environment:
      groups:
        - flightpath_secrets
      ios_signing:
        distribution_type: app_store
        bundle_identifier: uk.co.flightpath.flightPath
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Flutter packages get
        script: flutter packages pub get
      - name: Analyzer
        script: flutter analyze
      - name: Unit tests
        script: flutter test
      - name: Add PrivacyInfo to Xcode project
        script: |
          gem install xcodeproj
          ruby tool/add_privacy_manifest.rb
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_IDENTIFIER" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Pod install
        script: |
          cd ios
          pod install
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1) \
            --build-number=$(($(($(google-app-store-connect-build-number "$BUNDLE_IDENTIFIER") + 1)))) \
            --dart-define=REVENUECAT_IOS_KEY=$REVENUECAT_IOS_KEY \
            --dart-define=REVENUECAT_ANDROID_KEY=$REVENUECAT_ANDROID_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"
