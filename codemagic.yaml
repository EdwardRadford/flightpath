workflows:
  ios-testflight:
    name: FlightPath iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/ios/Pods
    integrations:
      app_store_connect: Flight Path Admin
    environment:
      groups:
        - flightpath_secrets
      vars:
        XCODE_WORKSPACE: ios/Runner.xcworkspace
        XCODE_SCHEME: Runner
        BUNDLE_IDENTIFIER: uk.co.flightpath.flightPath
      flutter: 3.41.6
      xcode: 26.0
      cocoapods: default
    scripts:
      - name: Flutter packages get
        script: flutter packages pub get
      - name: Analyzer
        script: flutter analyze --no-fatal-infos
      - name: Unit tests
        script: flutter test
      - name: Add PrivacyInfo to Xcode project
        script: |
          gem install xcodeproj
          ruby tool/add_privacy_manifest.rb
      - name: Set up code signing
        script: |
          set -e
          set -x
          keychain initialize

          # CI builds run on ephemeral Mac VMs — the private key for any
          # existing iOS distribution cert lives only on the VM that
          # created it (which is gone). So revoke every existing cert at
          # the start, then create fresh + matching key inside this VM.
          # Revoking a distribution cert does NOT invalidate already-
          # shipped apps, so this is safe.
          echo "=== revoking any existing distribution certs ==="
          app-store-connect certificates list --type IOS_DISTRIBUTION --json 2>/dev/null \
            | python3 -c "import sys,json; data=json.load(sys.stdin); [print(c['id']) for c in (data if isinstance(data,list) else [])]" \
            | while read -r cert_id; do
                if [ -n "$cert_id" ]; then
                  echo "Revoking $cert_id"
                  app-store-connect certificates delete "$cert_id" --ignore-not-found || true
                fi
              done

          echo "=== existing bundle ids ==="
          app-store-connect bundle-ids list --bundle-id-identifier "$BUNDLE_IDENTIFIER" || true

          echo "=== creating fresh dist cert + private key ==="
          ssh-keygen -t rsa -b 2048 -m PEM -f /tmp/dist_cert_key -q -N ""
          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key @file:/tmp/dist_cert_key \
            --save

          echo "=== fetching signing files ==="
          app-store-connect fetch-signing-files "$BUNDLE_IDENTIFIER" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/dist_cert_key

          keychain add-certificates
          xcode-project use-profiles
      - name: Pod install
        script: |
          cd ios
          # Delete Podfile.lock + Pods/ so each CI build resolves fresh
          # against the current spec repo. Without this, stale pins
          # (e.g. PurchasesHybridCommon 17.52 when the plugin needs 17.53)
          # block pod install. Lockfile reproducibility doesn't matter
          # here — Ed builds only on CI for iOS.
          rm -f Podfile.lock
          rm -rf Pods
          pod install --repo-update
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-name=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1) \
            --build-number=$(($(app-store-connect get-latest-testflight-build-number "$BUNDLE_IDENTIFIER") + 1)) \
            --dart-define=REVENUECAT_IOS_KEY=$REVENUECAT_IOS_KEY \
            --dart-define=REVENUECAT_ANDROID_KEY=$REVENUECAT_ANDROID_KEY \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - "Internal Testers"
