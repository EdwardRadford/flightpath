      C 968 748, 952 756, 928 752
      C 908 748, 900 740, 904 728
      C 906 720, 910 716, 916 716 Z"/>
    <rect x="488" y="800" width="48" height="6" fill="#F87171"/>
  </g>

  <!-- Wordmark - DM Serif Display. High-contrast editorial display face. -->
  <text x="372" y="216"
        font-family="'DM Serif Display', 'Playfair Display', Georgia, serif"
        font-size="172"
        font-weight="400"
        font-style="normal"
        letter-spacing="-3"
        fill="#0F0F0F">FlightPath</text>
</svg>
