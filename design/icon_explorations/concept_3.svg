<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Concept 3 - Climbout arc -->
  <!-- A single flowing brush stroke that arcs upward from the lower-left like a -->
  <!-- climbout from runway: heavy at the takeoff roll, lighter and faster as the -->
  <!-- aircraft establishes its climb. One mark, one gesture. The ink-bead leading -->
  <!-- the stroke reads as the aircraft itself. -->
  <!-- Background: warm cream paper. Accent: warm sand #F59E0B. No gradients. -->
  <!-- The stroke is a single filled path with deliberate weight variation. -->

  <!-- Paper -->
  <rect width="1024" height="1024" fill="#F6F1E7"/>

  <!-- The arc. Drawn as a closed filled path so weight can taper organically. -->
  <!-- Lower-left anchor (heavy) -> sweeping climb -> upper-right tip (light). -->
  <!-- Inner edge and outer edge of the stroke are different curves; that's what -->
  <!-- gives it the brush feel without using stroke-width tricks. -->
  <path fill="#0F0F0F" d="
    M 152 824
    C 244 832, 372 808, 488 720
    C 612 624, 720 488, 800 348
    C 836 288, 860 252, 868 244
    L 856 248
    C 832 264, 796 308, 752 372
    C 660 504, 552 624, 432 712
    C 348 776, 256 808, 168 812
    Z"/>

  <!-- A second inner glide that thickens the heel of the stroke -->
  <!-- (the "rotation" - heaviest where the wheels just leave the tarmac). -->
  <path fill="#0F0F0F" d="
    M 152 824
    C 232 836, 320 832, 392 800
    C 360 808, 308 812, 252 808
    C 216 804, 184 812, 152 824 Z"/>

  <!-- The "ink bead" at the leading edge of the stroke - this reads as -->
  <!-- the aircraft. A single warm-sand droplet, lozenge-shaped, tilted into -->
  <!-- the direction of travel so it carries momentum. -->
  <path fill="#F59E0B" d="
    M 856 244
    C 884 232, 908 232, 920 244
    C 928 256, 920 272, 896 280
    C 872 288, 848 280, 840 268
    C 836 256, 844 248, 856 244 Z"/>

  <!-- A faint pilot-pencil mark: a single short tick where the stroke -->
  <!-- begins, like a takeoff point annotated on a chart. Same warm-sand. -->
  <!-- Disappears at favicon size; present at 1024. -->
  <rect x="120" y="840" width="56" height="6" fill="#F59E0B"/>
</svg>
