<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Concept 9 - Windsock - REFINED v5
       Pole shortened. Cone unchanged. Bbox re-centred.

       Canvas 1024 x 1024. Artwork bbox (after translate):
         x: ~270 .. ~752   (width ~482, left margin ~270, right margin ~272)
         y: ~248 .. ~776   (height ~528, top margin ~248, bottom margin ~248)
       Margins: top == bottom. left ~= right (within 2 px, same as v4).

       Composition (path-source coords, before translate):
         Mast on vertical line x=357 (offset left of canvas centre so the
         cone's rightward mass balances).
         Cross-bar y=128..148 sits at the very top of the bbox.
         Cone hangs immediately below the cross-bar via 4 suspension cords.
         Cone occupies upper portion of bbox (cone y=200..340).
         Mast extends from y=148 to y=643. (was y=148..890 in v4)
         Ground anchors at y=633..649 form the bottom of the bbox. (was 880..896)

       Pole length (path-source) = 643 - 148 = 495 px.
       Cone length (path-source) = 747 - 447 = 300 px.
       Pole : cone ratio = 1.65 : 1.   (v4 was 2.49 : 1)
       Sits in the requested 1.5 - 1.8 window. Pole still visibly taller
       than the cone, but no longer dominates the canvas.

       Cone geometry unchanged from v4 (5 bands of 60 px each along length 300):
         Mouth front: x=447, y=200..340 (dia 140).
         Tail back:   x=747, y=252..288 (dia 36).
         Linear taper between, top slope +0.1733, bottom slope -0.1733.
         Band breaks at x=507, 567, 627, 687.

       Translate(-2.98 126.50): same horizontal fudge as v4 (extents are
       horizontally unchanged), new vertical fudge so the new bbox is
       centred on canvas mid-line. Computed by: pre-translate y extents
       ~122..649 -> centre 385.5. Canvas centre 512. dy = 512 - 385.5 = 126.5.

       Single accent: red-orange #EA580C. Paper: #F6F1E7. Ink: #0F0F0F.
       No gradients, no blur, no shadows, no rounded outer bounds.
  -->

  <!-- Paper -->
  <rect width="1024" height="1024" fill="#F6F1E7"/>

  <!-- Centring translate: horizontal = -2.98 (same as v4, extents
       unchanged); vertical = 126.50 (recomputed for shorter pole). -->
  <g transform="translate(-2.98 126.50)">

  <!-- ============================================================
       MAST + CROSS-BAR + GROUND ANCHORS
       Mast centerline at x=357, top of cross-bar at y=128.
       v5: mast bottom y=643 (was 890). Ground anchors y=633..649.
       ============================================================ -->

  <!-- Mast - heavy ink, slight bow + taper. Top y=148, bottom y=643. -->
  <path fill="#0F0F0F" d="
    M 343 148
    C 339 260, 339 480, 345 643
    L 369 643
    C 375 480, 375 260, 371 148
    C 367 142, 347 142, 343 148 Z"/>

  <!-- Cross-bar at the top of the mast. y=128..148, x=285..429. -->
  <path fill="#0F0F0F" d="
    M 289 128
    C 320 120, 394 120, 425 128
    C 425 134, 425 142, 425 148
    C 394 156, 320 156, 289 148
    C 285 142, 285 134, 289 128 Z"/>

  <!-- Left ground anchor - splays left from mast base to x=277. -->
  <path fill="#0F0F0F" d="
    M 277 633
    C 308 627, 340 633, 357 643
    C 340 647, 312 649, 293 647
    C 281 645, 273 639, 277 633 Z"/>

  <!-- Right ground anchor - mirrors left anchor. -->
  <path fill="#0F0F0F" d="
    M 437 633
    C 406 627, 374 633, 357 643
    C 374 647, 402 649, 421 647
    C 433 645, 441 639, 437 633 Z"/>

  <!-- ============================================================
       CONE - red-orange tube envelope with two cream "gap" bands punched
       through to give 5-band stripe.
       Envelope (UNCHANGED from v4):
         x=447 top=200 bot=340 (mouth, dia 140)
         x=507 top=210 bot=330 (dia 120)
         x=567 top=221 bot=319 (dia  98)
         x=627 top=231 bot=309 (dia  78)
         x=687 top=242 bot=298 (dia  56)
         x=747 top=252 bot=288 (tail, dia 36)
       ============================================================ -->

  <!-- Cone envelope - red-orange filled tube. -->
  <path fill="#EA580C" d="
    M 447 200
    C 487 200, 567 218, 627 232
    C 667 242, 707 250, 747 252
    C 751 256, 751 284, 747 288
    C 707 290, 667 298, 627 308
    C 567 322, 487 340, 447 340
    C 441 336, 439 320, 439 270
    C 439 220, 441 204, 447 200 Z"/>

  <!-- Gap band 2 (open paper) - between band 1 and band 3. x=507..567. -->
  <path fill="#F6F1E7" d="
    M 507 212
    C 527 215, 547 218, 567 222
    L 567 318
    C 547 322, 527 325, 507 328
    L 507 212 Z"/>

  <!-- Gap band 4 (open paper) - between band 3 and band 5. x=627..687. -->
  <path fill="#F6F1E7" d="
    M 627 233
    C 647 236, 667 239, 687 243
    L 687 297
    C 667 301, 647 304, 627 307
    L 627 233 Z"/>

  <!-- ============================================================
       CONTINUOUS INK RIM - top arc + bottom arc + tail-back + mouth-front
       wraps the cone outline.
       ============================================================ -->

  <!-- Top rim arc. -->
  <path fill="#0F0F0F" d="
    M 447 196
    C 487 196, 567 214, 627 228
    C 667 238, 707 246, 747 248
    L 751 252
    C 711 250, 671 242, 627 232
    C 567 218, 487 200, 447 200
    L 447 196 Z"/>

  <!-- Bottom rim arc. -->
  <path fill="#0F0F0F" d="
    M 447 344
    C 487 344, 567 326, 627 312
    C 667 302, 707 294, 747 292
    L 751 288
    C 711 290, 671 298, 627 308
    C 567 322, 487 340, 447 340
    L 447 344 Z"/>

  <!-- Tail-end rim - rounded back of the smaller opening. -->
  <path fill="#0F0F0F" d="
    M 747 248
    C 751 252, 751 288, 747 292
    L 751 288
    C 755 288, 755 252, 751 252
    L 747 248 Z"/>

  <!-- Mouth-front rim - left edge of the wide opening. -->
  <path fill="#0F0F0F" d="
    M 447 196
    C 441 218, 439 240, 439 270
    C 439 300, 441 322, 447 344
    L 443 344
    C 435 322, 433 300, 433 270
    C 433 240, 435 218, 443 196
    L 447 196 Z"/>

  <!-- ============================================================
       BAND DIVIDERS - thin ink rules at the four gap-band edges.
       Drawn AFTER the rims so they sit on top.
       ============================================================ -->

  <!-- Gap-2 left edge. -->
  <path fill="#0F0F0F" d="
    M 507 212
    C 505 250, 505 290, 507 328
    L 501 328
    C 499 290, 499 250, 501 212
    C 503 209, 505 209, 507 212 Z"/>

  <!-- Gap-2 right edge. -->
  <path fill="#0F0F0F" d="
    M 567 222
    C 565 256, 565 284, 567 318
    L 561 318
    C 559 284, 559 256, 561 222
    C 563 219, 565 219, 567 222 Z"/>

  <!-- Gap-4 left edge. -->
  <path fill="#0F0F0F" d="
    M 627 233
    C 625 256, 625 284, 627 307
    L 621 307
    C 619 284, 619 256, 621 233
    C 623 230, 625 230, 627 233 Z"/>

  <!-- Gap-4 right edge. -->
  <path fill="#0F0F0F" d="
    M 687 243
    C 685 261, 685 279, 687 297
    L 681 297
    C 679 279, 679 261, 681 243
    C 683 240, 685 240, 687 243 Z"/>

  <!-- ============================================================
       SUSPENSION CORDS - 4 thin ink lines from cross-bar pivot
       (~357, 148) to four points around the mouth front rim.
       Lines are short (~110 px) and angle right + down.
       ============================================================ -->

  <!-- Cord 1 - to top of mouth rim ~ (447, 200). -->
  <path fill="#0F0F0F" d="
    M 357 150
    C 380 162, 415 182, 446 200
    L 449 198
    C 418 178, 382 158, 358 146
    L 357 150 Z"/>

  <!-- Cord 2 - to upper-mid mouth rim ~ (442, 247). -->
  <path fill="#0F0F0F" d="
    M 357 152
    C 376 178, 410 218, 441 247
    L 444 245
    C 414 216, 379 174, 358 148
    L 357 152 Z"/>

  <!-- Cord 3 - to lower-mid mouth rim ~ (442, 293). -->
  <path fill="#0F0F0F" d="
    M 358 152
    C 374 198, 408 252, 441 293
    L 444 291
    C 412 250, 377 196, 359 148
    L 358 152 Z"/>

  <!-- Cord 4 - to bottom of mouth rim ~ (447, 340). -->
  <path fill="#0F0F0F" d="
    M 358 154
    C 374 222, 408 296, 446 340
    L 449 338
    C 412 294, 378 220, 359 150
    L 358 154 Z"/>

  <!-- ============================================================
       PIVOT INK-BEAD - small filled dot at the cord origin on the
       cross-bar. Sits at the underside of the bar.
       ============================================================ -->

  <path fill="#0F0F0F" d="
    M 349 144
    C 363 144, 373 150, 373 156
    C 373 164, 363 170, 357 170
    C 347 170, 339 164, 339 156
    C 339 150, 343 144, 349 144 Z"/>

  </g>
</svg>
